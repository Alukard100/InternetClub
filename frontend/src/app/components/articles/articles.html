<div class="top-section">
    <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="search" placeholder="Search" [formControl]="searchControl" />
    </mat-form-field>

    <button matButton="outlined" (click)="openAddNewArticle()">
        <mat-icon matPrefix>article_shortcut</mat-icon>
        New article
    </button>
</div>

<div class="bottom-section">
    <div class="bottom-section mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" class="full-width-table">

            <!-- Title -->
            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>Title</th>
                <td mat-cell *matCellDef="let article">{{ article.title }}</td>
            </ng-container>

            <!-- Published -->
            <ng-container matColumnDef="published">
                <th mat-header-cell *matHeaderCellDef>Published</th>
                <td mat-cell *matCellDef="let article">
                    {{ article.published ? 'Yes' : 'No' }}
                </td>
            </ng-container>


            <!-- Created At -->
            <ng-container matColumnDef="createdAt">
                <th mat-header-cell *matHeaderCellDef>Created At</th>
                <td mat-cell *matCellDef="let article">
                    {{ article.createdAt | date: 'dd-MM-yyyy' }}
                </td>
            </ng-container>
            <!-- Type -->
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef>Type</th>
                <td mat-cell *matCellDef="let article">{{ ArticleType[article.type] }}</td>
            </ng-container>
            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
                <td mat-cell *matCellDef="let article" class="actions-cell">
                    <button mat-icon-button color="primary" (click)="editArticle(article)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteArticle(article)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>

        </table>

        <mat-paginator
            [length]="totalCount"
            [pageSize]="pageSize"
            [pageSizeOptions]="[10, 20, 50]"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</div>
