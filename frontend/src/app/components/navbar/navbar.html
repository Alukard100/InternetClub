<nav class="navbar">
  <div class="navbar-left">
    <div class="logo" (click)="navigateHome()">
      <!-- replace later with SVG -->
      <span>IC</span>
    </div>

    @if (isAdmin) {
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/users" routerLinkActive="active">Igrači</a>
      <a routerLink="/articles" routerLinkActive="active">Obavijesti</a>
      <a routerLink="/transactions" routerLinkActive="active">Transakcije</a>
    }
  </div>

  <div class="navbar-right">

    @if (isUser) {
      <a class="adding" (click)="AddFunds()" routerLink="/"><mat-icon>add</mat-icon></a>
    }

    @if (!isLoggedIn) {
      <a class="primary" (click)="openLoginDialog()">Login</a>
      <a class="accent" (click)="openSignUpDialog()">Sign up</a>
    }
    @else {
      <a class="warn" (click)="logout()">Logout</a>
    }
  </div>
</nav>
