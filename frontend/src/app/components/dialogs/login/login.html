<h2 mat-dialog-title>Login</h2>

  <button
    mat-icon-button
    type="button"
    class="close-button"
    aria-label="Close dialog"
    (click)="closeDio()"
  >
    <mat-icon>close</mat-icon>
  </button>

<form (ngSubmit)="Login()">
  <mat-dialog-content>
    <div class="dialog-body">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput (keyup.enter)="Login()" name="username" [formControl]="username" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput (keyup.enter)="Login()" type="password" name="password" [type]="hidePassword ? 'password' : 'text'" [formControl]="password" required>
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

    </div>
    
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-flat-button color="primary" type="submit" [disabled]="!username.valid || !password.valid">Login</button>
  </mat-dialog-actions>
</form>
