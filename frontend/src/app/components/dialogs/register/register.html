<h2 mat-dialog-title>Register</h2>

  <button
    mat-icon-button
    type="button"
    class="close-button"
    aria-label="Close dialog"
    (click)="closeDio()"
    >
    <mat-icon>close</mat-icon>
  </button>

<form (ngSubmit)="Register()">
    <mat-dialog-content>
        <div class="dialog-body">
            <mat-form-field appearance="outline">
                <mat-label>Username</mat-label>
                <input matInput (keyup.enter)="Register()" name="username" [formControl]="username" required>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput (keyup.enter)="Register()" type="password" name="password" [type]="hidePassword ? 'password' : 'text'" [formControl]="password" required>
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Repeat Password</mat-label>
                <input matInput (keyup.enter)="Register()" type="password" name="repeatPassword" [type]="hidePassword1 ? 'password' : 'text'" [formControl]="repeatPassword" required>
                <button mat-icon-button matSuffix type="button" (click)="hidePassword1 = !hidePassword1">
                    <mat-icon>{{ hidePassword1 ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                @if (repeatPassword.hasError('mismatch')) {
                    <mat-error>
                        Passwords do not match
                    </mat-error>
                }
            </mat-form-field>
        </div>
    </mat-dialog-content>


    <mat-dialog-actions align="center">
        <button mat-flat-button color="primary" type="submit" [disabled]="!username.valid || !password.valid || !repeatPassword.valid">Register</button>
    </mat-dialog-actions>

</form>
